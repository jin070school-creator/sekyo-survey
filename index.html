<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>세교중 학교평가 설문</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: one calm reading column; a sticky progress strip; each question is a row of five large, equal answer tiles (5 → 1, left to right, as on the paper form). */
:root{
  --bg:#f6f8f7; --surface:#ffffff; --ink:#18241f; --muted:#5c6b65; --line:#dbe3df;
  --accent:#1f6b4f; --accent-ink:#ffffff; --accent-soft:#e3f1ea;
  --s5:#1f6b4f; --s4:#3f8f6c; --s3:#8a9a93; --s2:#b9875a; --s1:#a5543f;
  --warn:#b4451f; --warn-soft:#fbeae3;
  --f-display:"Gowun Batang","Nanum Myeongjo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111816; --surface:#18221e; --ink:#e7eeea; --muted:#9db0a8; --line:#2b3a34;
  --accent:#5fc59a; --accent-ink:#0d1a14; --accent-soft:#1d3329;
  --s5:#5fc59a; --s4:#4aa47d; --s3:#7d8e87; --s2:#c99a6c; --s1:#d07a62;
  --warn:#f0906c; --warn-soft:#3a221a; color-scheme:dark}}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.65;-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:break-word}
.wrap{max-width:760px;margin:0 auto;padding:28px 16px 64px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;font-weight:700;letter-spacing:-.01em}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:10px}
[hidden]{display:none!important}

/* header */
.school{font-size:14px;font-weight:600;color:var(--accent);letter-spacing:.06em}
.head h1{font-size:clamp(24px,5.2vw,34px);line-height:1.35;margin-top:6px}
.badge{display:inline-block;margin-top:12px;padding:4px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:15px}
.intro{color:var(--muted);margin:14px 0 0;max-width:62ch}

/* role chooser */
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:28px}
.role{display:flex;flex-direction:column;gap:4px;text-align:left;padding:20px 18px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;color:var(--ink);transition:border-color .15s,transform .15s}
.role:hover{border-color:var(--accent);transform:translateY(-2px)}
.role b{font-family:var(--f-display);font-size:22px}
.role span{color:var(--muted);font-size:15px}
@media (max-width:560px){.roles{grid-template-columns:1fr}}

/* sticky progress */
.bar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.bar .t{font-weight:600;font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.track{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.fill{height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .3s}
.back{background:none;border:0;color:var(--muted);font-size:15px;cursor:pointer;padding:4px 2px;white-space:nowrap}

/* legend */
.legend{margin-top:22px;padding:14px 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);gap:6px;font-size:13.5px;text-align:center;color:var(--muted)}
.legend b{display:block;color:var(--ink);font-size:14.5px;line-height:1.35}
@media (max-width:480px){.legend{padding:12px 8px;gap:4px;font-size:12px}.legend b{font-size:13px}}
.legend i{display:block;width:10px;height:10px;border-radius:50%;margin:0 auto 4px}

/* questions */
.qlist{display:flex;flex-direction:column;gap:14px;margin-top:22px}
.q{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:20px 18px 18px;scroll-margin-top:80px;transition:border-color .2s}
.q.done{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.q.missing{border-color:var(--warn)}
.q .no{font-family:var(--f-display);font-weight:700;color:var(--accent);font-size:20px;margin-right:6px}
.q .txt{font-size:18px;font-weight:500;line-height:1.6}
.q .ex{display:block;color:var(--muted);font-size:15px;font-weight:400;margin-top:4px}
.q .need{display:none;color:var(--warn);font-size:14px;font-weight:600;margin-top:8px}
.q.missing .need{display:block}

.opts{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:16px}
.opt{--c:var(--s3);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:76px;padding:10px 4px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer;text-align:center;line-height:1.25;transition:background .12s,border-color .12s,transform .08s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.opt .n{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--c)}
.opt .l{font-size:14.5px;font-weight:600;word-break:keep-all}
.opt:hover{border-color:var(--c)}
.opt:active{transform:scale(.97)}
.opt[aria-checked="true"]{background:var(--c);border-color:var(--c);color:#fff}
.opt[aria-checked="true"] .n{color:#fff}
@media (prefers-color-scheme:dark){.opt[aria-checked="true"],.opt[aria-checked="true"] .n{color:#0d1a14}}
.opt[aria-checked="true"]::after{content:"✓";position:absolute;top:5px;right:8px;font-size:13px;font-weight:700}
.opt[data-v="5"]{--c:var(--s5)}.opt[data-v="4"]{--c:var(--s4)}.opt[data-v="3"]{--c:var(--s3)}.opt[data-v="2"]{--c:var(--s2)}.opt[data-v="1"]{--c:var(--s1)}
@media (max-width:480px){.opt{min-height:70px;padding:8px 2px}.opt .l{font-size:13px}.opt .n{font-size:20px}.q{padding:18px 14px 14px}}

/* open questions */
.sec{margin-top:36px}
.sec h2{font-size:22px}
.sec p.s{color:var(--muted);margin:6px 0 0;font-size:15px}
.open{display:flex;flex-direction:column;gap:6px;margin-top:18px}
.open label{font-weight:600;font-size:16.5px}
.open small{color:var(--muted);font-size:14px;font-weight:400}
textarea{width:100%;min-height:110px;resize:vertical;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:16px;line-height:1.6}
textarea:focus{border-color:var(--accent);outline:none}

/* submit */
.submit{margin-top:32px;display:flex;flex-direction:column;gap:10px;align-items:stretch}
.btn{appearance:none;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:18px;padding:17px 20px;cursor:pointer}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);font-size:16px;padding:12px 18px}
.msg{font-size:15px;color:var(--muted);text-align:center;min-height:1.5em}
.msg.err{color:var(--warn);font-weight:600}

/* thanks */
.thanks{text-align:center;padding:60px 8px}
.thanks .mark{width:72px;height:72px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:36px;margin:0 auto 18px}
.thanks h2{font-size:28px}
.thanks p{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

function loadDraft(r, g){ try{ return JSON.parse(localStorage.getItem(draftKey(r, g))||"null"); }catch(e){ return null; } }
function clearDraft(r, g){ try{ localStorage.removeItem(draftKey(r, g)); }catch(e){} }

/* 중복 참여 확인: 이 기기에서 제출한 기록을 남깁니다. 학부모는 자녀가 여러 명일 수 있어 학년별로 따로 확인합니다. */
function doneKey(r, g){ return "sekyo-survey-done-" + r + (r === "parent" ? "-" + g : ""); }
function isDone(r, g){ try{ return !!localStorage.getItem(doneKey(r, g)) || document.cookie.includes(doneKey(r, g) + "=1"); }catch(e){ return false; } }
function markDone(r, g){
  try{ localStorage.setItem(doneKey(r, g), new Date().toISOString()); }catch(e){}
  try{ document.cookie = doneKey(r, g) + "=1; max-age=31536000; path=/; SameSite=None; Secure"; }catch(e){}
}

/* ---------- routing ---------- */
function go(r, g){
  g = +g || null;
  if (!S[r]) renderHome();
  else if (isDone(r, g)) renderDone(r, g);
  else if (S[r].grades && !GRADES.includes(g)) renderGrade(r);
  else renderSurvey(r, g);
  window.scrollTo(0,0);
}
document.getElementById("backBtn").onclick = () => go(null);

/* ---------- home ---------- */
function renderHome(){
  role = null; bar.hidden = true;
  app.innerHTML = `
    <header class="head">
      <div class="school">${SCHOOL}</div>
      <h1>${TITLE}</h1>
      <p class="intro">응답하시는 분에 맞는 설문을 선택해 주세요. 12개 문항과 3개의 서술형 문항으로 구성되어 있으며 5분 정도 걸립니다.</p>
    </header>
    <nav class="roles" aria-label="설문 대상 선택">
      <button type="button" class="role" data-r="student"><b>학생</b><span>학생용 설문</span></button>
      <button type="button" class="role" data-r="parent"><b>학부모</b><span>학부모용 설문</span></button>
      <button type="button" class="role" data-r="staff"><b>교직원</b><span>교직원용 설문</span></button>
    </nav>`;
  app.querySelectorAll(".role").forEach(b => b.onclick = () => go(b.dataset.r));
}

/* ---------- grade chooser ---------- */
function renderGrade(r){
  role = null; bar.hidden = true; const s = S[r];
  app.innerHTML = `
    <header class="head">
      <div class="school">${SCHOOL}</div>
      <h1>${TITLE}</h1>
      <span class="badge">${s.label}</span>
      <p class="intro">${s.grades}.</p>
    </header>
    <nav class="roles" aria-label="학년 선택">
      ${GRADES.map(g=>`<button type="button" class="role" data-g="${g}"><b>${g}학년</b><span>${s.who === "학부모" ? "자녀 " : ""}${g}학년</span></button>`).join("")}
    </nav>
    <div class="submit"><button type="button" class="btn ghost" id="homeBtn">← 처음으로</button></div>`;
  app.querySelectorAll(".role").forEach(b => b.onclick = () => go(r, b.dataset.g));
  document.getElementById("homeBtn").onclick = () => go(null);
}

/* ---------- already done ---------- */
function renderDone(r, g){
  role = null; bar.hidden = true;
  app.innerHTML = `<div class="thanks"><div class="mark" aria-hidden="true">✓</div>
    <h2>이미 응답에 참여하였습니다</h2><p>${S[r].label}${g ? ` (${g}학년)` : ""} 설문에 이미 응답하셨습니다.<br>참여해 주셔서 감사합니다.</p>
    <p style="margin-top:28px"><button type="button" class="btn ghost" id="homeBtn">처음으로</button></p></div>`;
  document.getElementById("homeBtn").onclick = () => go(null);
}

/* ---------- survey ---------- */
function renderSurvey(r, g){
  role = r; grade = g; const s = S[r]; answers = {};
  const d = loadDraft(r, g);
  if (d && d.answers) answers = d.answers;
  bar.hidden = false;
  app.innerHTML = `
    <header class="head">
      <div class="school">${SCHOOL}</div>
      <h1>${TITLE}</h1>
      <span class="badge">${s.label}${g ? ` · ${g}학년` : ""}</span>
      <p class="intro">${esc(s.intro)}</p>
    </header>
    <div class="legend" aria-hidden="true">
      ${SCALE.map(o=>`<div><i style="background:var(--s${o.v})"></i><b>${o.v}. ${o.l}</b>${o.p}</div>`).join("")}
    </div>
    <form id="f" novalidate>
      <div class="qlist">
        ${s.q.map((q,i)=>`
          <div class="q" id="q${i+1}" role="group" aria-labelledby="t${i+1}">
            <div class="txt" id="t${i+1}"><span class="no">${i+1}</span>${esc(q[0])}${q[1]?`<span class="ex">(${esc(q[1])})</span>`:""}</div>
            <div class="opts" role="radiogroup" aria-label="${i+1}번 문항 응답">
              ${SCALE.map(o=>`<button type="button" class="opt" role="radio" aria-checked="false" data-q="${i+1}" data-v="${o.v}" id="q${i+1}-${o.v}"><span class="n">${o.v}</span><span class="l">${o.l}</span></button>`).join("")}
            </div>
            <div class="need">이 문항에 응답해 주세요.</div>
          </div>`).join("")}
      </div>
      <section class="sec">
        <h2>서술형 문항</h2>
        <p class="s">자유롭게 적어 주세요. 비워 두셔도 제출할 수 있습니다.</p>
        ${OPEN.map(o=>`<div class="open"><label for="o-${o.k}">${o.l}${o.h?`<br><small>${o.h}</small>`:""}</label>
          <textarea id="o-${o.k}" maxlength="2000">${esc(d && d.open ? d.open[o.k] : "")}</textarea></div>`).join("")}
      </section>
      <div class="submit">
        <button class="btn" id="sendBtn" type="submit">설문 제출하기</button>
        <div class="msg" id="msg" aria-live="polite"></div>
      </div>
    </form>`;
  Object.entries(answers).forEach(([q,v]) => mark(+q, v));
  app.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
    const q = +b.dataset.q, v = +b.dataset.v;
    const first = !answers[q];
    answers[q] = v; mark(q, v); saveDraft();
    if (first) setTimeout(() => goNext(q), 220);
  }));
  app.querySelectorAll(".opts").forEach(g => g.addEventListener("keydown", e => {
    const btns = [...g.querySelectorAll(".opt")]; const i = btns.indexOf(document.activeElement);
    if (i < 0) return;
    if (e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); btns[Math.min(4,i+1)].focus(); }
    if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); btns[Math.max(0,i-1)].focus(); }
  }));
  app.querySelectorAll("textarea").forEach(t => t.addEventListener("input", saveDraft));
  document.getElementById("f").addEventListener("submit", onSubmit);
  updateProgress();
}
function mark(q, v){
  const fs = document.getElementById("q"+q); if (!fs) return;
  fs.querySelectorAll(".opt").forEach(b => b.setAttribute("aria-checked", String(+b.dataset.v === +v)));
  fs.classList.add("done"); fs.classList.remove("missing");
  updateProgress();
}
function goNext(q){
  const n = S[role].q.length;
  for (let i = q+1; i <= n; i++) if (!answers[i]) { document.getElementById("q"+i).scrollIntoView({behavior: reduce?"auto":"smooth", block:"center"}); return; }
}
function updateProgress(){
  const n = S[role]?.q.length || 12, c = Object.keys(answers).length;
  fill.style.width = (c/n*100) + "%"; prog.textContent = `${c} / ${n}`;
}
function readOpen(){ const o={}; OPEN.forEach(x => { const t=document.getElementById("o-"+x.k); o[x.k] = t ? t.value.trim() : ""; }); return o; }
function onSubmit(e){
  e.preventDefault();
  const msg = document.getElementById("msg"), btn = document.getElementById("sendBtn");
  const n = S[role].q.length; const miss = [];
  for (let i=1;i<=n;i++) if (!answers[i]) { miss.push(i); document.getElementById("q"+i).classList.add("missing"); }
  if (miss.length) {
    msg.className = "msg err"; msg.textContent = `${miss.join(", ")}번 문항에 아직 응답하지 않았습니다.`;
    document.getElementById("q"+miss[0]).scrollIntoView({behavior: reduce?"auto":"smooth", block:"center"});
    return;
  }
  btn.disabled = true; msg.className = "msg"; msg.textContent = "제출하는 중입니다…";
  const payload = { role, grade, answers: Array.from({length:n},(_,i)=>answers[i+1]), open: readOpen() };
  const r = role, g = grade;
  const fail = text => { btn.disabled = false; msg.className = "msg err"; msg.textContent = text; };
  if (!SHEET_URL) return fail("설문 저장 주소가 아직 설정되지 않았습니다. 설문 담당 선생님께 알려 주세요.");
  // 본문을 text/plain으로 보내야 브라우저가 사전 확인(CORS preflight) 없이 Apps Script로 바로 보냅니다.
  fetch(SHEET_URL, { method: "POST", body: JSON.stringify(payload) })
    .then(res => res.json())
    .then(res => {
      if (!res.ok) return fail(res.error || "제출하지 못했습니다. 다시 눌러 주세요.");
      markDone(r, g); clearDraft(r, g); renderThanks();
    })
    .catch(() => fail("제출하지 못했습니다. 인터넷 연결을 확인한 뒤 다시 눌러 주세요."));
}
function renderThanks(){
  bar.hidden = true;
  app.innerHTML = `<div class="thanks"><div class="mark" aria-hidden="true">✓</div>
    <h2>설문이 제출되었습니다</h2><p>소중한 의견 감사합니다.<br>2027학년도 학교교육과정 수립에 반영하겠습니다.</p>
    <p style="margin-top:28px"><button type="button" class="btn ghost" id="homeBtn">처음으로</button></p></div>`;
  document.getElementById("homeBtn").onclick = () => go(null);
  window.scrollTo(0,0);
}

/* 주소 끝에 ?role=student / parent / staff 를 붙이면 해당 설문이 바로 열립니다. (&grade=1~3 을 더 붙이면 학년 선택도 건너뜁니다) */
const params = new URLSearchParams(location.search);
go(params.get("role"), params.get("grade"));
</script>
</body>
</html>
