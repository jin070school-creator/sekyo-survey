<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>설문 QR코드</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#f6f8f7;--surface:#fff;--ink:#18241f;--muted:#5c6b65;--line:#dbe3df;--accent:#1f6b4f;--warn:#b4451f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Malgun Gothic",sans-serif;font-size:16px;line-height:1.6;word-break:keep-all}
.wrap{max-width:980px;margin:0 auto;padding:28px 16px 64px}
h1{font-family:"Gowun Batang",serif;font-size:28px;margin:0}
p.s{color:var(--muted);margin:6px 0 0}
.form{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
input{flex:1;min-width:0;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font:inherit;font-size:15px}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 18px;background:var(--accent);color:#fff;cursor:pointer}
button.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.err{color:var(--warn);font-weight:600;margin-top:8px;min-height:1.5em}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:12px}
@media (max-width:760px){.cards{grid-template-columns:1fr}}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:22px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.card .sch{color:var(--accent);font-weight:600;font-size:13px;letter-spacing:.06em}
.card h2{font-family:"Gowun Batang",serif;font-size:24px;margin:0}
.card .qr img,.card .qr canvas{display:block;width:220px;height:220px}
.card code{font-size:12px;color:var(--muted);word-break:break-all}
.actions{display:flex;gap:8px;margin-top:20px}
@media print{
  body{background:#fff}.wrap>header,.form,.err,.actions,.card button{display:none!important}
  .cards{grid-template-columns:1fr;gap:0}
  .card{border:0;page-break-after:always;padding-top:80px}
  .card h2{font-size:40px}.card .qr img,.card .qr canvas{width:360px;height:360px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>설문 QR코드</h1>
    <p class="s">학생·학부모·교직원용 QR코드입니다. <b>이미지로 저장</b>해서 e알리미·가정통신문에 넣거나, <b>인쇄하기</b>로 대상별 한 장씩 뽑아 게시하세요.</p>
  </header>
  <div class="form" id="form" hidden>
    <input id="url" placeholder="https://아이디.github.io/저장소이름/" autocomplete="off">
    <button id="make" type="button">QR코드 만들기</button>
  </div>
  <div class="err" id="err"></div>
  <div class="cards" id="cards"></div>
  <div class="actions" id="actions" hidden>
    <button id="print" type="button" class="ghost">인쇄하기 (대상별 1장씩)</button>
  </div>
</div>
<script>
const TARGETS = [
  {r:"student", name:"학생용 설문"},
  {r:"parent",  name:"학부모용 설문"},
  {r:"staff",   name:"교직원용 설문"}
];
const $ = id => document.getElementById(id);

function make(base){
  $("err").textContent = "";
  if (!/^https?:\/\//.test(base)) { $("err").textContent = "https:// 로 시작하는 사이트 주소를 넣어 주세요."; return; }
  base = base.replace(/(index|qr)\.html.*$/, "").replace(/[?#].*$/, "");
  if (!base.endsWith("/")) base += "/";
  $("cards").innerHTML = "";
  TARGETS.forEach(t => {
    const link = `${base}?role=${t.r}`;
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<div class="sch">세교중학교 학교평가</div><h2>${t.name}</h2><div class="qr"></div><code>${link}</code><button type="button" class="ghost">이미지로 저장</button>`;
    $("cards").appendChild(card);
    new QRCode(card.querySelector(".qr"), {text: link, width: 600, height: 600, correctLevel: QRCode.CorrectLevel.M});
    card.querySelector("button").onclick = () => savePng(card.querySelector(".qr canvas"), t.name);
  });
  $("actions").hidden = false;
}

// QR 위에 제목을 넣어 PNG 한 장으로 저장합니다.
function savePng(qr, name){
  const W = 800, c = document.createElement("canvas");
  c.width = W; c.height = 980;
  const x = c.getContext("2d");
  x.fillStyle = "#fff"; x.fillRect(0, 0, W, c.height);
  x.fillStyle = "#1f6b4f"; x.textAlign = "center";
  x.font = "600 30px 'IBM Plex Sans KR','Malgun Gothic',sans-serif";
  x.fillText("세교중학교 학교평가", W/2, 70);
  x.fillStyle = "#18241f";
  x.font = "700 56px 'Gowun Batang','Malgun Gothic',serif";
  x.fillText(name, W/2, 145);
  x.drawImage(qr, 100, 200, 600, 600);
  x.fillStyle = "#5c6b65";
  x.font = "400 26px 'IBM Plex Sans KR','Malgun Gothic',sans-serif";
  x.fillText("휴대폰 카메라로 QR코드를 비춰 주세요", W/2, 880);
  const a = document.createElement("a");
  a.download = `세교중_${name}_QR.png`;
  a.href = c.toDataURL("image/png");
  a.click();
}

$("print").onclick = () => window.print();
// 사이트에 올라가 있으면 자기 주소로 바로 만들고, 내 컴퓨터에서 열었으면 주소를 입력받습니다.
if (location.protocol.startsWith("http")) make(location.href);
else {
  $("form").hidden = false;
  $("make").onclick = () => make($("url").value.trim());
  $("url").addEventListener("keydown", e => { if (e.key === "Enter") make($("url").value.trim()); });
}
</script>
</body>
</html>
